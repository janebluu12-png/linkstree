<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ร้านขนมลิงก์ในฝัน</title>
  <meta name="description" content="ตู้ขนมในฝัน — จิ้มขนมสักชิ้น แล้วจะพาไปหากัน">
  <meta name="theme-color" content="#fdf1ea">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Itim&family=Mali:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- ฟิลเตอร์เส้นดินสอ: ทำให้เส้นสั่นๆ เหมือนวาดมือ -->
  <svg class="defs" width="0" height="0" aria-hidden="true" focusable="false">
    <defs>
      <filter id="pencil" x="-10%" y="-10%" width="120%" height="120%">
        <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="3" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <filter id="pencil-ghost" x="-10%" y="-10%" width="120%" height="120%">
        <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="11" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="3.6" xChannelSelector="G" yChannelSelector="R"/>
      </filter>
      <filter id="wobble" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
    </defs>
  </svg>

  <div class="bunting" id="bunting" aria-hidden="true"></div>

  <!-- ฉากคาเฟ่ด้านหลัง (เฉพาะจอกว้าง วางในที่ว่างข้างๆ ไม่ทับเนื้อหา) -->
  <div class="cafe" aria-hidden="true">
    <div class="wall"></div>

    <!-- หน้าต่างโค้ง + ม่าน -->
    <svg class="cafe-art win" viewBox="0 0 220 280">
      <defs><clipPath id="glassClip"><path d="M40 246 L40 108 Q40 40 110 40 Q180 40 180 108 L180 246 Z"/></clipPath></defs>
      <g filter="url(#pencil)" stroke="#7b5a48" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round">
        <path d="M28 256 L28 106 Q28 28 110 28 Q192 28 192 106 L192 256 Z" fill="#e6bf94"/>
        <path class="glass" d="M40 246 L40 108 Q40 40 110 40 Q180 40 180 108 L180 246 Z" fill="#cfe3f7"/>
        <g clip-path="url(#glassClip)" stroke="none">
          <circle class="sun" cx="148" cy="84" r="16" fill="#ffe08a"/>
          <g class="moon"><circle cx="148" cy="84" r="15" fill="#fff4c9"/><circle cx="156" cy="78" r="13" class="moon-cut" fill="#2d2a55"/></g>
          <g class="clouds" fill="#fff">
            <path d="M52 140 Q50 126 64 126 Q70 114 84 120 Q98 116 100 130 Q110 132 106 142 Z"/>
            <path d="M120 196 Q118 184 130 184 Q136 174 148 180 Q160 176 162 188 Q172 190 168 200 Z"/>
            <path d="M44 214 Q44 204 54 205 Q60 198 68 204 Q76 202 76 212 Z" opacity=".8"/>
          </g>
          <path d="M40 246 Q80 222 120 232 Q156 222 180 230 L180 250 L40 250 Z" fill="#bfe0b8"/>
        </g>
        <path d="M110 40 L110 246 M40 150 L180 150" fill="none" stroke-width="4"/>
        <!-- ม่าน -->
        <path d="M22 30 Q50 28 60 34 Q66 90 50 140 Q60 170 62 250 L22 250 Z" fill="#f6c2c8"/>
        <path d="M198 30 Q170 28 160 34 Q154 90 170 140 Q160 170 158 250 L198 250 Z" fill="#f6c2c8"/>
        <path d="M44 130 Q56 142 66 134 M176 130 Q164 142 154 134" fill="none" stroke="#e98a96" stroke-width="3.4"/>
        <path d="M14 26 Q40 44 66 26 Q92 44 110 26 Q128 44 154 26 Q180 44 206 26 L206 16 L14 16 Z" fill="#fbd7dc"/>
        <rect x="10" y="10" width="200" height="8" rx="4" fill="#c99366"/>
        <!-- ขอบหน้าต่าง + ของบนขอบ -->
        <rect x="16" y="252" width="188" height="12" rx="4" fill="#d9a877"/>
        <path d="M58 252 L62 234 L80 234 L84 252 Z" fill="#e7a07a"/>
        <path d="M71 234 Q64 214 70 206 Q74 214 71 234 Q78 216 84 214 Q82 226 71 234" fill="#9ccf8f"/>
        <path d="M140 252 L142 236 Q154 233 166 236 L168 252 Z" fill="#fffaf2"/>
        <path d="M167 240 Q176 241 167 248" fill="none"/>
        <path class="steam" d="M150 228 Q146 220 152 214 Q156 208 152 202 M160 228 Q156 220 162 214" fill="none" stroke-width="2" opacity=".55"/>
        <!-- แมวนอนบนขอบหน้าต่าง -->
        <g class="cat">
          <path d="M130 250 Q142 256 140 268 Q138 278 147 282" fill="none" stroke-width="9"/>
          <path d="M130 250 Q142 256 140 268 Q138 278 147 282" fill="none" stroke="#fbe7cf" stroke-width="4.6"/>
          <g class="cat-breathe">
            <path d="M88 252 Q88 232 106 230 Q126 227 136 238 Q140 246 136 252 Z" fill="#fbe7cf"/>
            <path d="M112 231 Q123 229 129 235 Q121 240 113 236 Z" fill="#f1bf86" stroke="none"/>
            <path d="M84 233 L85 220 L94 228 Z" fill="#fbe7cf"/>
            <path d="M99 228 L107 220 L107 233 Z" fill="#f1bf86"/>
            <ellipse cx="95" cy="240" rx="14" ry="11.5" fill="#fbe7cf"/>
            <path d="M99 229 Q104 228 107 231 Q104 236 99 233 Z" fill="#f1bf86" stroke="none"/>
            <path d="M86.5 240 q3 2.6 6 0 M98 240 q3 2.6 6 0" fill="none" stroke-width="1.8"/>
            <path d="M93 245 q1.3 1.4 2.6 0 q1.3 1.4 2.6 0" fill="none" stroke-width="1.4"/>
            <ellipse cx="85" cy="245" rx="3" ry="1.6" fill="#f7a3a8" stroke="none" opacity=".75"/>
            <ellipse cx="106" cy="245" rx="3" ry="1.6" fill="#f7a3a8" stroke="none" opacity=".75"/>
            <path d="M92 252 Q92 247 98 247 Q103 247 103 252" fill="#fff6ea" stroke-width="2"/>
          </g>
        </g>
        <g class="zzz" fill="#a3826e" stroke="none" font-family="Itim, sans-serif">
          <text x="76" y="220" font-size="10">z</text>
          <text x="68" y="208" font-size="13">z</text>
          <text x="58" y="194" font-size="16">Z</text>
        </g>
      </g>
    </svg>


    <!-- กระดานเมนู -->
    <svg class="cafe-art board" viewBox="0 0 200 230">
      <g filter="url(#pencil)" stroke="#7b5a48" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round">
        <path d="M100 6 L40 52 M100 6 L160 52" fill="none" stroke-width="1.8"/>
        <circle cx="100" cy="6" r="4" fill="#c99366"/>
        <rect x="14" y="48" width="172" height="176" rx="10" fill="#c99366"/>
        <rect x="24" y="58" width="152" height="156" rx="6" fill="#4e3d37"/>
        <g fill="#fff6ea" stroke="none" font-family="Itim, sans-serif" text-anchor="middle">
          <text x="100" y="88" font-size="17">TODAY'S MENU</text>
          <text x="100" y="118" font-size="14">♡ ลาเต้ฟองนุ่ม</text>
          <text x="100" y="140" font-size="14">♡ ช็อตเค้กสตรอว์</text>
          <text x="100" y="162" font-size="14">♡ ครัวซองต์อุ่นๆ</text>
        </g>
        <g fill="none" stroke="#fff6ea" stroke-width="1.8" opacity=".85">
          <path d="M44 96 Q100 102 156 96"/>
          <path d="M84 178 L86 200 L110 200 L112 178 Z"/><path d="M112 184 Q122 186 112 194"/>
          <path d="M92 174 Q90 168 94 164 M102 174 Q100 168 104 164"/>
          <path d="M40 200 l4 -6 l4 6 l-4 6 Z M154 182 l3 -5 l3 5 l-3 5 Z"/>
        </g>
      </g>
    </svg>



  </div>

  <div class="dreamy" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
  <div class="sky" id="sky" aria-hidden="true"></div>

  <button class="lamp" id="lamp" type="button" aria-label="เปิด/ปิดไฟร้าน (สลับโหมดกลางคืน)">
    <span class="lamp-cord"></span>
    <svg viewBox="0 0 60 64" class="lamp-art" aria-hidden="true">
      <g filter="url(#pencil)" stroke="#7b5a48" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">
        <ellipse class="lamp-light" cx="30" cy="46" rx="11" ry="11" fill="#fff3c4"/>
        <path d="M6 40 Q8 14 30 12 Q52 14 54 40 Q30 46 6 40 Z" fill="#f4b6bf"/>
        <path d="M14 30 Q22 24 30 24" fill="none" stroke="#fff" stroke-opacity=".7"/>
        <rect x="25" y="4" width="10" height="9" rx="3" fill="#e2b98d"/>
      </g>
    </svg>
    <span class="lamp-pull"><i></i></span>
  </button>

  <main class="shop">
    <header class="profile">
      <div class="avatar" id="avatar"></div>
      <h1 class="sign" id="sign">SWEET LINKS</h1>
      <p class="handle" id="handle"></p>
      <p class="note" id="bio"></p>
    </header>

    <p class="hint" id="hint"><span aria-hidden="true">✎</span> <span id="hintText">จิ้มขนมที่ชอบได้เลย</span> <span aria-hidden="true">↓</span></p>

    <!-- ตู้ขนมมุมเฉียง + เคาน์เตอร์ข้างๆ -->
    <div class="display" id="display">
      <section class="case" id="case" aria-label="ตู้ขนม">
        <svg class="case-back" id="caseBack" aria-hidden="true"></svg>
        <!-- แมวนอนบนตู้ (จอเล็ก) -->
        <svg class="case-cat" viewBox="54 186 100 100" aria-hidden="true">
          <g filter="url(#pencil)" stroke="#6b4a3a" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round">
        <g class="cat">
          <path d="M130 250 Q142 256 140 268 Q138 278 147 282" fill="none" stroke-width="9"/>
          <path d="M130 250 Q142 256 140 268 Q138 278 147 282" fill="none" stroke="#fbe7cf" stroke-width="4.6"/>
          <g class="cat-breathe">
            <path d="M88 252 Q88 232 106 230 Q126 227 136 238 Q140 246 136 252 Z" fill="#fbe7cf"/>
            <path d="M112 231 Q123 229 129 235 Q121 240 113 236 Z" fill="#f1bf86" stroke="none"/>
            <path d="M84 233 L85 220 L94 228 Z" fill="#fbe7cf"/>
            <path d="M99 228 L107 220 L107 233 Z" fill="#f1bf86"/>
            <ellipse cx="95" cy="240" rx="14" ry="11.5" fill="#fbe7cf"/>
            <path d="M99 229 Q104 228 107 231 Q104 236 99 233 Z" fill="#f1bf86" stroke="none"/>
            <path d="M86.5 240 q3 2.6 6 0 M98 240 q3 2.6 6 0" fill="none" stroke-width="1.8"/>
            <path d="M93 245 q1.3 1.4 2.6 0 q1.3 1.4 2.6 0" fill="none" stroke-width="1.4"/>
            <ellipse cx="85" cy="245" rx="3" ry="1.6" fill="#f7a3a8" stroke="none" opacity=".75"/>
            <ellipse cx="106" cy="245" rx="3" ry="1.6" fill="#f7a3a8" stroke="none" opacity=".75"/>
            <path d="M92 252 Q92 247 98 247 Q103 247 103 252" fill="#fff6ea" stroke-width="2"/>
          </g>
        </g>
        <g class="zzz" fill="#a3826e" stroke="none" font-family="Itim, sans-serif">
          <text x="76" y="220" font-size="10">z</text>
          <text x="68" y="208" font-size="13">z</text>
          <text x="58" y="194" font-size="16">Z</text>
        </g>
          </g>
        </svg>
        <span class="giggle g1" aria-hidden="true">กิ๊ๆ</span>
        <span class="giggle g2" aria-hidden="true">หอมจัง~</span>
        <div class="shelves" id="shelves"></div>
        <svg class="case-front" id="caseFront" aria-hidden="true"></svg>
      </section>

      <div class="counter">
        <div class="counter-top">
          <button class="bell" id="bell" type="button" aria-label="กดกริ่ง เสี่ยงขนม">
            <svg viewBox="0 0 80 70" class="bell-art" aria-hidden="true">
              <g filter="url(#pencil)" stroke="#6b4a3a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
                <ellipse cx="40" cy="61" rx="31" ry="6" fill="#e2b98d"/>
                <path d="M15 57 Q15 22 40 20 Q65 22 65 57 Z" fill="#f7d77a"/>
                <path d="M24 46 Q24 30 36 27" fill="none" stroke="#fff" stroke-opacity=".8"/>
                <circle cx="40" cy="15" r="5.5" fill="#f4b6bf"/>
              </g>
            </svg>
          </button>
        </div>
        <div class="counter-body">
          <span class="chalk-sign" aria-hidden="true">♡ กดกริ่งเสี่ยงขนมได้นะ</span>
        </div>
      </div>
    </div>

    <!-- โต๊ะคาเฟ่ที่วางเมนู (รายชื่อลิงก์แบบตัวหนังสือ) -->
    <section class="cafe-table" aria-labelledby="menuTitle">
      <h2 id="menuTitle">วันนี้ในตู้มีอะไรบ้างน้า?</h2>
      <div class="tabletop">
        <svg class="table-item cup" viewBox="0 0 90 80" aria-hidden="true">
          <g filter="url(#pencil)" stroke="#6b4a3a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
            <path class="steam" d="M34 20 Q28 12 36 6 M48 20 Q42 12 50 6" fill="none" stroke-width="2.4" opacity=".55"/>
            <ellipse cx="44" cy="70" rx="38" ry="7" fill="#fbd7dc"/>
            <path d="M18 30 L22 62 Q44 72 66 62 L70 30 Z" fill="#fffaf2"/>
            <path d="M69 36 Q86 38 68 54" fill="none"/>
            <ellipse cx="44" cy="30" rx="26" ry="7" fill="#c98a4d"/>
            <path d="M38 29 q6 -5 12 0 q-6 4 -12 0 Z" fill="#fffaf2" stroke-width="1.6"/>
          </g>
        </svg>
        <div class="placemat">
          <div class="menu-oval" id="menuList"></div>
        </div>
        <svg class="table-item cake" viewBox="0 0 100 80" aria-hidden="true">
          <g filter="url(#pencil)" stroke="#6b4a3a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
            <ellipse cx="50" cy="70" rx="44" ry="8" fill="#fffaf2"/>
            <path d="M22 66 L22 40 L60 28 L80 38 L80 66 Q50 70 22 66 Z" fill="#fde3a6"/>
            <path d="M22 40 L60 28 L80 38 L44 48 Z" fill="#fffaf2"/>
            <path d="M44 48 L44 68" fill="none"/>
            <path d="M23 54 L43 58 M45 58 L79 52" fill="none" stroke="#f8a7b2" stroke-width="4"/>
            <path d="M58 30 C50 26 51 16 58 17 C65 16 66 26 58 30 Z" fill="#f26d72"/>
            <path d="M84 70 L96 50" fill="none" stroke-width="3.4"/>
          </g>
        </svg>
      </div>
      <div class="table-leg" aria-hidden="true">
        <svg viewBox="0 0 160 90">
          <g filter="url(#pencil)" stroke="#6b4a3a" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round">
            <rect x="70" y="0" width="20" height="72" rx="4" fill="#c99366"/>
            <ellipse cx="80" cy="80" rx="58" ry="9" fill="#a8775a"/>
          </g>
        </svg>
      </div>
    </section>

    <footer class="foot">
      <p>วาดด้วยดินสอ <span aria-hidden="true">✎</span> และความฝันนิดหน่อย <span aria-hidden="true">☁</span></p>
    </footer>
  </main>

  <!-- มุมซูม: ชั้นขนมระยะใกล้ของแต่ละหมวด -->
  <div class="closeup" id="closeup" role="dialog" aria-modal="true" aria-labelledby="cuTitle" hidden>
    <div class="cu-leaves" aria-hidden="true">
      <svg viewBox="0 0 200 200">
        <g fill="#cfe8c0" opacity=".85">
          <ellipse cx="170" cy="40" rx="30" ry="16" transform="rotate(-30 170 40)"/><ellipse cx="140" cy="80" rx="26" ry="14" transform="rotate(20 140 80)"/>
          <ellipse cx="185" cy="110" rx="28" ry="15" transform="rotate(-50 185 110)"/><ellipse cx="160" cy="150" rx="24" ry="13" transform="rotate(10 160 150)"/>
          <ellipse cx="120" cy="30" rx="18" ry="10" transform="rotate(40 120 30)"/>
        </g>
      </svg>
    </div>
    <div class="cu-glass" aria-hidden="true"></div>
    <header class="cu-head">
      <button class="cu-back" id="cuBack" type="button">← กลับไปที่ตู้</button>
      <h2 class="cu-sign" id="cuTitle"></h2>
      <p class="cu-note" id="cuNote"></p>
    </header>
    <div class="cu-shelves" id="cuShelves"></div>
  </div>

  <div class="fortune" id="fortune" hidden>
    <div class="fortune-card" role="dialog" aria-modal="true" aria-labelledby="fortuneText">
      <p class="fortune-head">ขนมเสี่ยงทายของวันนี้คือ…</p>
      <div class="fortune-art" id="fortuneArt"></div>
      <p class="fortune-text" id="fortuneText"></p>
      <button type="button" class="fortune-close" id="fortuneClose">รับขนมไปเลย ♡</button>
    </div>
  </div>

  <script src="treats.js"></script>
  <script src="app.js"></script>
</body>
</html>
